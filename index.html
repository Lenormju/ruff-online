<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruff Online</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      textarea {
        width: 100%;
        height: 16rem;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        box-sizing: border-box;
      }
      #results {
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        padding-left: 1.25rem;
      }
      #error-banner {
        display: none;
        background: #fee;
        border: 1px solid #c00;
        color: #900;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        margin-top: 1rem;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>Ruff Online</h1>
    <p>Paste Python code and click Run to lint it with Ruff, entirely in your browser.</p>

    <textarea id="code-input" spellcheck="false">import os</textarea>
    <p><button id="run-button">Run</button></p>

    <ul id="results"></ul>
    <div id="error-banner"></div>

    <p><em>
      Walking skeleton (Phase 0): one hardcoded Ruff version, check only, no
      formatting, no config, no version picker, no sharing yet.
    </em></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
