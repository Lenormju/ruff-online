<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruff Online</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #editor-container {
        border: 1px solid #ccc;
      }
      #editor-container .cm-editor {
        height: 16rem;
      }
      #editor-container .cm-scroller {
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
      }
      #results {
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        padding-left: 1.25rem;
      }
      #results li.diagnostic {
        cursor: pointer;
      }
      #results li.diagnostic:hover {
        text-decoration: underline;
      }
      #error-banner {
        display: none;
        background: #fee;
        border: 1px solid #c00;
        color: #900;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        margin-top: 1rem;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
      #version-select {
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Ruff Online</h1>
    <p>Paste Python code and click Run to lint it with Ruff, entirely in your browser.</p>

    <div id="editor-container"></div>
    <p>
      <select id="version-select"></select>
      <button id="run-button">Run</button>
    </p>

    <ul id="results"></ul>
    <div id="error-banner"></div>

    <p><em>
      Phase 2: Multi-version support. Still missing: config, formatting,
      sharing.
    </em></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
