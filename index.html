<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruff Online</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #editor-container,
      #toml-container {
        border: 1px solid #ccc;
      }
      #editor-container .cm-editor {
        height: 16rem;
      }
      #toml-container .cm-editor {
        height: 8rem;
      }
      .cm-scroller {
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
      }
      #results {
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        padding-left: 1.25rem;
      }
      #results li.diagnostic {
        cursor: pointer;
      }
      #results li.diagnostic:hover {
        text-decoration: underline;
      }
      #error-banner {
        display: none;
        background: #fee;
        border: 1px solid #c00;
        color: #900;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        margin-top: 1rem;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
      #version-select {
        margin-right: 0.5rem;
      }
      /*
       * Deliberately NOT the red #error-banner styling: a TOML syntax error is
       * a third, distinct kind of failure — the config never reached Ruff, so
       * Ruff is never invoked at all.
       */
      #config-status {
        display: none;
        padding: 0.5rem 0.75rem;
        border-radius: 4px;
        margin-top: 0.5rem;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        background: #eef6ee;
        border: 1px solid #7a7;
        color: #262;
      }
      #config-status.parse-error {
        background: #fff8e0;
        border: 1px solid #d9a300;
        color: #7a5600;
      }
      #diff-view {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        white-space: pre;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        overflow-x: auto;
      }
      #diff-view:empty {
        display: none;
      }
      .diff-delete {
        background: #fee;
        color: #900;
      }
      .diff-insert {
        background: #efe;
        color: #262;
      }
      #apply-button {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Ruff Online</h1>
    <p>Paste Python code and click Check to lint it with Ruff, entirely in your browser.</p>

    <div id="editor-container"></div>
    <p>
      <select id="version-select"></select>
      <button id="check-button">Check</button>
      <button id="format-button">Format</button>
      <button id="apply-button">Apply</button>
    </p>

    <h2>Configuration</h2>
    <p>
      Ruff config in <code>pyproject.toml</code> form. Used automatically
      whenever you click Check.
    </p>
    <div id="toml-container"></div>
    <div id="config-status"></div>

    <h2>Results</h2>
    <ul id="results"></ul>
    <div id="error-banner"></div>

    <h2>Format diff</h2>
    <div id="diff-view"></div>

    <p><em>
      Phase 4: Format diff + Apply. Still missing: sharing, Visual/CLI modes.
    </em></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
