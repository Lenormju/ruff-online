name: Ingest Ruff versions

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Check for new Ruff releases
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "versions=$(node scripts/check-new-ruff-releases.mjs)" >> "$GITHUB_OUTPUT"

      - name: Ingest new versions
        id: ingest
        env:
          NEW_VERSIONS: ${{ steps.check.outputs.versions }}
        run: |
          set -e
          echo "New versions: $NEW_VERSIONS"
          ingested=()
          for version in $(echo "$NEW_VERSIONS" | jq -r '.[]'); do
            echo "::group::Ingesting Ruff $version"

            if ! node scripts/gen-rules-json.mjs "$version"; then
              echo "::warning::Failed to generate rules.json for Ruff $version, skipping"
              echo "::endgroup::"
              continue
            fi

            if ! node scripts/smoke-test.mjs "$version"; then
              echo "::warning::Smoke test failed for Ruff $version, skipping"
              echo "::endgroup::"
              continue
            fi

            node -e "
              const fs = require('fs');
              const path = 'public/supported-versions.json';
              const version = process.argv[1];
              const entry = {
                version,
                wasmUrl: \`https://cdn.jsdelivr.net/npm/@astral-sh/ruff-wasm-web@\${version}/ruff_wasm.js\`,
                rulesPath: \`versions/\${version}/rules.json\`,
              };
              const versions = JSON.parse(fs.readFileSync(path, 'utf-8'));
              versions.push(entry);
              fs.writeFileSync(path, JSON.stringify(versions, null, 2) + '\n');
            " "$version"

            echo "Ingested Ruff $version"
            ingested+=("$version")
            echo "::endgroup::"
          done

          echo "ingested=${ingested[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          INGESTED_VERSIONS: ${{ steps.ingest.outputs.ingested }}
        run: |
          if git diff --quiet -- public/supported-versions.json public/versions; then
            echo "No new versions ingested, nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/
            git commit -m "chore: ingest Ruff ${INGESTED_VERSIONS} (automated)"
            git push
          fi
